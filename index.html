<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VibeNet Pro - Mansingh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --ig-blue: #0095f6; --bg: #000; --border: #262626; }
        body { background: var(--bg); color: #fff; font-family: -apple-system, sans-serif; margin: 0; overflow: hidden; }
        .section { height: 100vh; display: none; }
        .active { display: block; }
        
        /* Reels Pro Engine */
        .reels-scroll { height: calc(100vh - 65px); overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .reels-scroll::-webkit-scrollbar { display: none; }
        .reel-box { height: calc(100vh - 65px); scroll-snap-align: start; position: relative; background: #000; }
        .video-wrap { width: 100%; height: 100%; overflow: hidden; position: relative; }
        iframe { width: 100vw; height: 177.77vw; min-height: 100vh; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }

        /* Sound Button Animation */
        .sound-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0; transition: 0.3s; pointer-events: none; }
        
        /* Chat Bubble Animation */
        .msg { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); margin-bottom: 8px; max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 14px; }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000; }
    </style>
</head>
<body>

    <div id="reels" class="section active">
        <div class="reels-scroll" id="reelsContainer">
            <div class="reel-box" onclick="toggleVolume('v1')">
                <div class="video-wrap">
                    <iframe id="v1" src="https://www.youtube.com/embed/S_S7pD8O02Y?autoplay=1&mute=1&controls=0&loop=1&playlist=S_S7pD8O02Y&enablejsapi=1" frameborder="0"></iframe>
                </div>
                <div id="sound-v1" class="sound-overlay"><i class="fas fa-volume-up text-5xl text-white/50"></i></div>
                <div class="absolute bottom-10 left-4 z-50">
                    <p class="font-bold flex items-center">mansingh_rathore <i class="fas fa-check-circle text-blue-500 ml-1"></i></p>
                    <p class="text-sm">Dubai HQ 2030 Vision 🇦🇪 #Trading</p>
                </div>
                <div class="absolute bottom-20 right-4 flex flex-col gap-6 text-2xl">
                    <i class="fas fa-heart text-red-500"></i>
                    <i class="fas fa-comment"></i>
                    <i class="fas fa-paper-plane" onclick="tab('chat')"></i>
                </div>
            </div>
            <div class="reel-box" onclick="toggleVolume('v2')">
                <div class="video-wrap">
                    <iframe id="v2" src="https://www.youtube.com/embed/tgbNymZ7vqY?autoplay=1&mute=1&controls=0&loop=1&playlist=tgbNymZ7vqY&enablejsapi=1" frameborder="0"></iframe>
                </div>
                <div id="sound-v2" class="sound-overlay"><i class="fas fa-volume-up text-5xl text-white/50"></i></div>
                <div class="absolute bottom-10 left-4 z-50">
                    <p class="font-bold flex items-center">mansingh_rathore <i class="fas fa-check-circle text-blue-500 ml-1"></i></p>
                    <p class="text-sm">SMC Strategy Mastery 📈</p>
                </div>
            </div>
        </div>
    </div>

    <div id="chat" class="section">
        <div class="p-4 border-b border-[#262626] flex items-center gap-3">
            <i class="fas fa-arrow-left" onclick="tab('reels')"></i>
            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-xs">MS</div>
            <span class="font-bold">Mansingh <i class="fas fa-check-circle text-blue-500"></i></span>
        </div>
        <div id="chatFlow" class="p-4 h-[75vh] overflow-y-auto flex flex-col">
            <div class="msg bg-[#262626] self-start">Welcome to VibeNet Messenger! 🚀</div>
        </div>
        <div class="fixed bottom-16 w-full p-3 bg-black flex gap-2 border-t border-[#262626]">
            <input id="chatInput" type="text" class="flex-1 bg-transparent border border-[#333] rounded-full px-4 py-2 text-sm outline-none" placeholder="Message...">
            <button onclick="sendMsg()" class="text-blue-500 font-bold px-3">Send</button>
        </div>
    </div>

    <div class="nav">
        <i class="fas fa-home text-2xl" onclick="tab('reels')"></i>
        <i class="fas fa-search text-2xl"></i>
        <i class="fas fa-play-circle text-2xl text-blue-500" onclick="tab('reels')"></i>
        <i class="fab fa-facebook-messenger text-2xl" onclick="tab('chat')"></i>
        <i class="fas fa-user-circle text-2xl"></i>
    </div>

    <script>
        function tab(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // UNMUTE & SOUND CONTROL
        function toggleVolume(id) {
            const iframe = document.getElementById(id);
            const overlay = document.getElementById('sound-' + id);
            
            // Unmute command
            iframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
            iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
            
            overlay.style.opacity = "1";
            setTimeout(() => overlay.style.opacity = "0", 800);
        }

        // ANIMATED MESSAGE SENDING
        function sendMsg() {
            const input = document.getElementById('chatInput');
            if(input.value.trim() !== "") {
                const flow = document.getElementById('chatFlow');
                const div = document.createElement('div');
                div.className = "msg bg-blue-600 self-end text-white";
                div.innerText = input.value;
                flow.appendChild(div);
                input.value = "";
                flow.scrollTop = flow.scrollHeight;
            }
        }
    </script>
</body>
</html>
